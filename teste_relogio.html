<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste do relógio · CorridaLive</title>
<style>
  body{margin:0;background:#070f24;color:#e8eefc;font:15px/1.4 system-ui,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8a9bc4;font-size:13px;margin-bottom:14px}
  .card{background:#0e1b3a;border:1px solid #1c2d57;border-radius:14px;padding:14px;margin-bottom:12px}
  .status{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
  .dot{width:16px;height:16px;border-radius:50%;background:#8a9bc4;flex:0 0 16px}
  .ok .dot{background:#36d399;box-shadow:0 0 12px #36d399}
  .alerta .dot{background:#ffc145}
  .erro .dot{background:#ff3b4e}
  .ok{color:#36d399}.alerta{color:#ffc145}.erro{color:#ff3b4e}
  .det{color:#8a9bc4;font-size:13px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font:14px ui-monospace,Menlo,monospace}
  td{padding:6px 4px;border-top:1px solid #1c2d57}
  td:first-child{color:#8a9bc4;width:45%}
  h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#8a9bc4;margin:0 0 8px}
  #log{font:12px ui-monospace,Menlo,monospace;color:#cfd8ff;max-height:220px;overflow:auto;white-space:pre-wrap}
  input,button{font:15px system-ui,sans-serif;border-radius:10px;border:1px solid #1c2d57;padding:10px 12px}
  input{background:#0a1430;color:#e8eefc;width:100%;box-sizing:border-box;margin-bottom:8px}
  button{background:#ff8a3d;color:#1a0e05;font-weight:800;border:0;width:100%}
  button:disabled{opacity:.5}
  .dica{font-size:13px;color:#ffc145;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔧 Teste do relógio</h1>
  <div class="sub">Mostra em tempo real se o relógio está mandando dados para o Firebase.</div>

  <div class="card">
    <div class="status" id="st"><span class="dot"></span><span id="stTxt">Conectando ao Firebase…</span></div>
    <div class="det" id="stDet"></div>
  </div>

  <div class="card">
    <h2>Último dado recebido do relógio</h2>
    <table id="tab"><tr><td colspan="2" style="color:#8a9bc4">Aguardando…</td></tr></table>
  </div>

  <div class="card">
    <h2>Mandar mensagem de teste para o relógio</h2>
    <input id="msg" maxlength="200" value="Teste do chat: tudo certo?">
    <button id="btn" disabled>Enviar para o relógio</button>
    <div class="dica" id="aviso"></div>
  </div>

  <div class="card">
    <h2>Histórico desta tela</h2>
    <div id="log"></div>
  </div>
</div>

<script type="module">
const FIREBASE_URL = "https://garmin-81aab-default-rtdb.firebaseio.com";
const API_KEY = "AIzaSyCztX48uZXS_5ay7BeNDrF7dmqZnd96m6U";
const $ = id => document.getElementById(id);
const hora = d => d.toLocaleTimeString("pt-BR");
function log(t) { $("log").textContent = hora(new Date()) + "  " + t + "\n" + $("log").textContent; }

const NOMES = {
  status: "Status do app", t: "Horário do envio", id: "Corrida (id)", gps: "GPS",
  fc: "FC (bpm)", fcMedia: "FC média", fcMax: "FC máx", dist: "Distância (m)", km: "Km completos",
  vel: "Velocidade (m/s)", velMedia: "Vel. média (m/s)", tempo: "Tempo (s)", cad: "Cadência",
  cal: "Calorias", passos: "Passos", bb: "Body Battery", alt: "Altitude (m)", subida: "Subida (m)",
  lat: "Latitude", lon: "Longitude"
};

let ultimo = null, contador = 0;
function situacao() {
  if (!ultimo) return;
  const idade = Math.round(Date.now() / 1000 - (ultimo.t || 0));
  const st = $("st");
  st.className = "status";
  let txt, det;
  if (idade <= 40) {
    st.classList.add("ok"); txt = "Relógio enviando ✅";
    det = `Último dado há ${idade} s · status do app: ${ultimo.status}`;
  } else if (idade <= 180) {
    st.classList.add("alerta"); txt = "Relógio atrasado ⚠️";
    det = `Último dado há ${idade} s. O app pode estar fechando ou sem conexão com o iPhone.`;
  } else {
    st.classList.add("erro"); txt = "Relógio NÃO está enviando ❌";
    const m = Math.round(idade / 60);
    det = `Último dado: ${new Date(ultimo.t * 1000).toLocaleString("pt-BR")} (há ${m >= 120 ? Math.round(m / 60) + " h" : m + " min"}).`;
  }
  $("stTxt").textContent = txt; $("stDet").textContent = det;
}
setInterval(situacao, 1000);

function mostrar(a) {
  ultimo = a;
  const linhas = Object.keys(NOMES).filter(k => a[k] !== undefined).map(k => {
    let v = a[k];
    if (k === "t") v = new Date(v * 1000).toLocaleString("pt-BR");
    if (typeof v === "number" && k !== "t" && k !== "id") v = Math.round(v * 100) / 100;
    return `<tr><td>${NOMES[k]}</td><td>${v}</td></tr>`;
  });
  const faltam = ["cal", "passos", "bb"].filter(k => a[k] === undefined).map(k => NOMES[k]);
  if (faltam.length && a.status !== "pronto") linhas.push(`<tr><td>Não veio</td><td style="color:#ffc145">${faltam.join(", ")}</td></tr>`);
  $("tab").innerHTML = linhas.join("");
  situacao();
}

try {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, onValue, push, update, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const app = initializeApp({ databaseURL: FIREBASE_URL, apiKey: API_KEY });
  const db = getDatabase(app);

  onValue(ref(db, ".info/connected"), s => log(s.val() ? "Página conectada ao Firebase" : "Página desconectada do Firebase"));

  onValue(ref(db, "live/atual"), snap => {
    const a = snap.val();
    if (!a) { $("stTxt").textContent = "Nenhum dado do relógio no Firebase"; return; }
    contador++;
    if (contador > 1) log(`Chegou dado novo do relógio (status: ${a.status}, FC: ${a.fc ?? "--"})`);
    else log("Lido o último dado gravado pelo relógio");
    mostrar(a);
  }, e => { $("st").className = "status erro"; $("stTxt").textContent = "Erro ao ler o Firebase"; log("Erro: " + e.message); });

  let uid = null;
  signInAnonymously(getAuth(app)).then(r => { uid = r.user.uid; $("btn").disabled = false; })
    .catch(e => { $("aviso").textContent = "Não consegui entrar no chat: " + (e.code || e.message); });

  $("btn").onclick = () => {
    const texto = $("msg").value.trim();
    if (!texto || !uid) return;
    $("btn").disabled = true;
    const k = push(ref(db, "chat")).key;
    update(ref(db), {
      ["chat/" + k]: { nome: "Teste", texto, uid, t: serverTimestamp() },
      ["chatTempo/" + uid]: serverTimestamp()
    }).then(() => {
      $("aviso").textContent = "Mensagem enviada! Ela deve aparecer no relógio em até ~15 s.";
      log("Mensagem de teste enviada ao chat");
    }).catch(() => { $("aviso").textContent = "Espere alguns segundos entre uma mensagem e outra."; })
      .finally(() => setTimeout(() => { $("btn").disabled = false; }, 6000));
  };
} catch (e) {
  $("st").className = "status erro"; $("stTxt").textContent = "Não consegui carregar o Firebase";
  log("Erro: " + e.message);
}
</script>
</body>
</html>
